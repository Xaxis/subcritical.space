# Part I, 5: the organisational and economic perspective (research/015-organisational.md).
# Every input names its basis and source. Derived numbers are in model/parts/015_organisational.py.
# Basis conventions in this file: a company's own figures (annual reports, guidance, keynotes) are
# vendor; independent counts and analyst estimates of past quantities are measured; outputs of a
# published model with stated uncertainty (Epoch's datasets and estimates) are modelled;
# projections someone else made are assumption; legal thresholds and draft-treaty values are spec.

