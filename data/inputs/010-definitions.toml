# Inputs for Part I's opening chapter, research/01-anatomy.md: what superintelligence is, and the
# six candidate definitions D1 to D6 restated after the survey. Every id starts with "def-".
# basis: measured | vendor | spec | design | assumption | modelled (see model/ledger.py).
# Convention here: a value fixed by a law, a framework or a published proposal is "spec"; a
# parameter another author chose by judgement is "assumption" with that author as source; the
# output of someone else's model is "modelled"; a company's claim about itself is "vendor"; a
# choice this project makes is "design".

# ---------------------------------------------------------------------------------------------
# Conventions

[def-days-per-year]
value = 365.25
unit = "days"
basis = "design"
fmt = ",.2f"
label = "days in a year (the Julian year), the convention used for unit conversions here"

[def-seconds-per-day]
value = 86400
unit = "s"
basis = "design"
fmt = ",.0f"
label = "seconds in a day, for unit conversions"

